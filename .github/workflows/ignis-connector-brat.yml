name: Publish Ignis Connector BRAT beta

"on":
  push:
    branches:
      - brat-preview
    paths:
      - ".github/workflows/ignis-connector-brat.yml"
      - "apps/obsidian-ignis-connector/manifest.json"

permissions:
  contents: write

concurrency:
  group: ignis-connector-brat-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out immutable distribution snapshot
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate source and tests
        run: |
          npm run lint
          npm run typecheck --workspace @ignis/obsidian-connector
          npm test -- --reporter=dot

      - name: Build the native Obsidian Connector
        run: npm run build --workspace @ignis/obsidian-connector

      - name: Exercise an isolated Ignis server and two Yjs clients
        run: node scripts/sync-smoke.mjs

      - name: Verify versioned BRAT assets and SHA-256 checksums
        run: node scripts/validate-brat-release.mjs

      - name: Publish immutable GitHub prerelease with BRAT assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const dirname = "release/brat";
            const manifest = JSON.parse(fs.readFileSync(path.join(dirname, "manifest.json"), "utf8"));
            const tag = manifest.version;
            if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(tag)) {
              throw new Error("Refusing a release without an explicit beta version");
            }
            if (manifest.id !== "ignis-connector" || manifest.isDesktopOnly !== false) {
              throw new Error("Unexpected plugin manifest");
            }
            // Never overwrite a versioned tag; each update must bump beta.
            try {
              await github.rest.git.getRef({
                ...context.repo, ref: "tags/" + tag
              });
              throw new Error("Refusing to overwrite existing tag " + tag);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let draft;
            try {
              draft = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: "Ignis Connector " + tag,
                body: "Experimental native Obsidian plugin beta.\n\n" +
                  "Install with BRAT: OzoneAsai/ignis.\n" +
                  "Server deployment and device enrollment are required.\n" +
                  "See docs/BRAT_DISTRIBUTION.md in the brat-preview branch.",
                draft: true,
                prerelease: true
              });
              const assets = [
                ["main.js", "application/javascript"],
                ["manifest.json", "application/json"],
                ["SHA256SUMS.txt", "text/plain"]
              ];
              for (const [name, mime] of assets) {
                const data = fs.readFileSync(path.join(dirname, name));
                await github.rest.repos.uploadReleaseAsset({
                  ...context.repo,
                  release_id: draft.data.id,
                  name,
                  data,
                  headers: {
                    "content-type": mime,
                    "content-length": data.byteLength
                  }
                });
              }
              await github.rest.repos.updateRelease({
                ...context.repo,
                release_id: draft.data.id,
                draft: false,
                prerelease: true
              });
              core.info("Published BRAT prerelease " + tag + " with verified assets");
            } catch (error) {
              if (draft) {
                await github.rest.repos.deleteRelease({
                  ...context.repo, release_id: draft.data.id
                }).catch(cleanupError =>
                  core.warning("Could not delete failed draft: " + cleanupError.message));
              }
              throw error;
            }
